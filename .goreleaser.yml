version: 2

project_name: axonhub

dist: .builds

before:
  hooks:
    - /bin/sh -c 'cd deploy && chmod +x *.sh'
    - make build-frontend
    - go mod tidy

builds:
  - id: build
    main: ./cmd/axonhub
    binary: axonhub
    flags:
      - -tags=nomsgpack
    ldflags:
      - -s -w -X github.com/looplj/axonhub/internal/build.Version={{ .Tag }}
      - -s -w -X github.com/looplj/axonhub/internal/build.Commit={{ .Commit }}
      - -s -w -X github.com/looplj/axonhub/internal/build.BuildTime={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - loong64
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: loong64
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: loong64

release:
  draft: true

archives:
  - id: archive
    ids: [build]
    formats: [zip]
    files:
      - LICENSE
      - CHANGELOG.md
      - config.example.yml
      - src: deploy/install.sh
        dst: install.sh
      - src: deploy/start.sh
        dst: start.sh
      - src: deploy/stop.sh
        dst: stop.sh
      - src: deploy/install.ps1
        dst: install.ps1
      - src: deploy/start.ps1
        dst: start.ps1
      - src: deploy/stop.ps1
        dst: stop.ps1
      - src: deploy/install.bat
        dst: install.bat
      - src: deploy/start.bat
        dst: start.bat
      - src: deploy/stop.bat
        dst: stop.bat

brews:
  - name: axonhub
    ids: [archive]
    repository:
      owner: cikichen
      name: homebrew-axonhub
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/cikichen/axonhub"
    description: "All-in-one AI development platform. Use any SDK, access any model."
    license: "Apache-2.0"
    url_template: "https://github.com/cikichen/axonhub/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: "github-actions[bot]"
      email: "github-actions[bot]@users.noreply.github.com"
    install: |
      libexec.install "axonhub"
      (etc/"axonhub").mkpath
      target = etc/"axonhub/config.yml"
      source = buildpath/"config.example.yml"
      target.write source.read unless target.exist?
      (bin/"axonhub").write <<~SH
        #!/bin/sh
        cd "#{etc}/axonhub" || exit 1
        exec "#{libexec}/axonhub" "$@"
      SH
    service: |
      run [opt_bin/"axonhub"]
      keep_alive true
    test: |
      system "#{bin}/axonhub", "version"
    caveats: |
      Config file: #{etc}/axonhub/config.yml
      The Homebrew wrapper starts AxonHub from #{etc}/axonhub so the default config is discovered automatically.
      Release archives also include config.example.yml for manual installs.

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^examples:"
      - "^ui:"
